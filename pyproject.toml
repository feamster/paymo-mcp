[project]
name = "paymo-mcp"
version = "0.1.0"
description = "MCP server for Paymo time tracking and invoice management"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.8.0",
    "pytz>=2023.3",
    "rich>=13.0.0",
    "click>=8.0.0",
    "dropbox>=11.0.0",
    "mcp>=2.3,<3",
]

[tool.uv]
# Run in place with `uv run`; dependencies only, no package build
package = false
